<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>URL Shortener Dashboard</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-4">
    <h1 class="text-center">URL Shortener Dashboard</h1>
    
    <!-- URL Shortening Form -->
    <div class="card p-4 mt-4">
        <h4>Shorten a URL</h4>
        <div class="input-group">
            <input type="text" id="long_url" class="form-control" placeholder="Enter long URL...">
            <button class="btn btn-primary" onclick="shortenURL()">Shorten</button>
        </div>
        <p class="mt-2" id="shortened_url"></p>
    </div>
    
    <!-- Search Form -->
    <div class="card p-4 mt-4">
        <h4>Search URLs</h4>
        <div class="input-group">
            <input type="text" id="search_query" class="form-control" placeholder="Search URLs, Titles, Descriptions, or Full Text...">
            <button class="btn btn-success" onclick="searchURLs(true)">Search</button>
        </div>
        <p class="mt-2"><strong>Total Results: </strong><span id="total_results">0</span></p>
    </div>
    
    <!-- Search Results Table -->
    <div class="card p-4 mt-4">
        <h4>Search Results</h4>
        <table class="table table-bordered mt-2">
            <thead>
                <tr>
                    <th>Short Code</th>
                    <th>Original URL</th>
                    <th>Title</th>
                    <th>Description</th>
                    <th>Word Count</th>
                    <th>Full Text</th>
                </tr>
            </thead>
            <tbody id="results_table">
                <tr><td colspan="6" class="text-center">No results yet</td></tr>
            </tbody>
        </table>
        <button class="btn btn-primary d-none" id="load_more" onclick="searchURLs(false)">Load More</button>
    </div>

    <script>
        let currentPage = 1;
        let lastQuery = "";

        async function shortenURL() {
            let long_url = document.getElementById("long_url").value;
            if (!long_url) return alert("Please enter a URL");

            let response = await fetch("/api/shorten", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ long_url })
            });
            let data = await response.json();

            if (data.short_url) {
                let shortenedURL = document.createElement("a");
                shortenedURL.href = data.short_url;
                shortenedURL.target = "_blank";
                shortenedURL.textContent = data.short_url;
                shortenedURL.onclick = function(event) {
                    event.preventDefault();
                    window.location.href = data.short_url; // Ensure correct redirection
                };
                
                let resultDiv = document.getElementById("shortened_url");
                resultDiv.innerHTML = "";
                resultDiv.appendChild(shortenedURL);
            } else {
                alert("Error: " + data.error);
            }
        }

        async function searchURLs(resetPage = true) {
            let query = document.getElementById("search_query").value;
            let table = document.getElementById("results_table");
            let totalResultsText = document.getElementById("total_results");
            let loadMoreBtn = document.getElementById("load_more");

            if (resetPage) {
                currentPage = 1;
                lastQuery = query;
                table.innerHTML = `<tr><td colspan="6" class="text-center">Searching...</td></tr>`;
            } else {
                currentPage++;
            }

            if (!query) {
                alert("Please enter a search term");
                return;
            }

            try {
                let response = await fetch(`/api/search?q=${encodeURIComponent(query)}&page=${currentPage}&size=50`);
                let data = await response.json();

                totalResultsText.textContent = data.total_results;
                if (resetPage) table.innerHTML = ""; // Clear previous results

                if (data.data.length === 0) {
                    table.innerHTML = `<tr><td colspan="6" class="text-center">No results found</td></tr>`;
                    return;
                }

                data.data.forEach(url => {
                    let truncatedText = url.full_text.length > 100 ? url.full_text.substring(0, 100) + "..." : url.full_text;
                    let fullText = url.full_text;

                    let row = `<tr>
                        <td><a href="/go/${url.short_code}" target="_blank">${url.short_code}</a></td>
                        <td><a href="${url.long_url}" target="_blank">${url.long_url}</a></td>
                        <td>${url.title || "N/A"}</td>
                        <td>${url.description || "N/A"}</td>
                        <td>${url.word_count || "N/A"}</td>
                        <td>
                            <span id="text-preview-${url.short_code}">${truncatedText}</span>
                            <button class="btn btn-link p-0" onclick="toggleFullText('${url.short_code}')">Show More</button>
                            <span id="full-text-${url.short_code}" style="display: none;">${fullText}</span>
                        </td>
                    </tr>`;
                    table.innerHTML += row;
                });

                // Show or hide "Load More" button
                if (data.total_results > currentPage * 50) {
                    loadMoreBtn.classList.remove("d-none");
                } else {
                    loadMoreBtn.classList.add("d-none");
                }

            } catch (error) {
                alert("Error fetching search results!");
                console.error("Search error:", error);
            }
        }

        function toggleFullText(shortCode) {
            let preview = document.getElementById(`text-preview-${shortCode}`);
            let fullText = document.getElementById(`full-text-${shortCode}`);
            let button = preview.nextElementSibling;

            if (fullText.style.display === "none") {
                preview.style.display = "none";
                fullText.style.display = "inline";
                button.innerText = "Show Less";
            } else {
                preview.style.display = "inline";
                fullText.style.display = "none";
                button.innerText = "Show More";
            }
        }
    </script>
</body>
</html>
